url: https://danielsangarci.github.io/easypaper/

template:
  bootstrap: 5
  bslib:
    primary: "#1a5632"
    base_font: {google: {family: "Source Sans 3", wght: [400, 600, 700], ital: [0, 1]}}
    code_font: {google: {family: "Source Code Pro", wght: [400, 700]}}

home:
  title: Scaffold a reproducible Quarto manuscript
  description: >
    Creates the whole structure of a reproducible scientific paper: sections as
    separate files, one entry point that renders it for any journal, and a
    submission folder with the blinded manuscript and a data and code
    compendium.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

reference:
  - title: Creating a project
    desc: The one function you need.
    contents:
      - create_paper
  - title: Bringing your data in
    desc: >
      Originals live wherever you keep them; data/ is the folder that
      publishes. This brings a copy in, converted or copied, in a format that
      will still open in twenty years. create_paper() writes the same function
      into every project, so it works with easypaper uninstalled.
    contents:
      - convert_data
  - title: Package
    contents:
      - easypaper-package

news:
  releases:
    - text: "Version 0.1.0"
      href: https://github.com/danielsangarci/easypaper/releases/tag/v0.1.0
